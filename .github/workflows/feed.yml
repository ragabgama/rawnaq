name: Facebook catalog feed
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    paths: ['tools/feed.py', '.github/workflows/feed.yml']
permissions:
  contents: write
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/feed.py feed.csv
      - run: |
          git config user.name "rawnaq-bot"
          git config user.email "rawnaq-bot@users.noreply.github.com"
          git add feed.csv
          git diff --cached --quiet || (git commit -m "Update catalog feed" && git push)
