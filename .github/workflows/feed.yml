name: Facebook catalog feed
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    paths: ['.github/feed.py', '.github/workflows/feed.yml']
permissions:
  contents: write
concurrency:
  group: feed
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/feed.py
      - run: |
          git config user.name "rawnaq-bot"
          git config user.email "rawnaq-bot@users.noreply.github.com"
          git add feed.csv store-products.json store-settings.json img sitemap.xml
          git diff --cached --quiet || (git commit -m "Update store data" && git pull --rebase && git push)
