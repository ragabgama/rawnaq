<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E4A52">
<title>لوحة التحكم | رونق</title>
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#F5F8F7;color:#10252A;display:grid;place-items:center;min-height:100vh;text-align:center;padding:16px;box-sizing:border-box}
.c{background:#fff;border-radius:16px;padding:24px;max-width:380px}
h1{color:#0E4A52;font-size:21px;margin:0 0 8px}
a{display:block;margin-top:14px;background:#FFB547;color:#10252A;border-radius:12px;padding:12px;font-weight:800;text-decoration:none}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="c">
  <h1>لوحة تحكم رونق</h1>
  <p id="msg">بنفتح اللوحة… هتدخل بحساب جوجل بتاعك.</p>
  <a id="go" href="#" hidden>فتح لوحة التحكم</a>
</div>
<script>
if (STORE.adminUrl) {
  document.getElementById('go').href = STORE.adminUrl;
  document.getElementById('go').hidden = false;
  location.replace(STORE.adminUrl);
} else {
  document.getElementById('msg').textContent = 'اللوحة لسه بتتجهز، وهتشتغل أول ما شيت الطلبات يتعمل.';
}
</script>
</body>
</html>
